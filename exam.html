
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025/26 中五級期終考試時間表 | S5 Exam Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
            background-color: #f0f9ff; /* Light sky blue background */
            color: #1e293b;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border-radius: 1.5rem;
        }

        /* Positive Orange-Yellow Gradient for the main countdown */
        .countdown-gradient {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            box-shadow: 0 15px 30px -10px rgba(245, 158, 11, 0.4);
        }

        .subject-tag-core { background-color: #dbeafe; color: #1e40af; }
        .subject-tag-elective { background-color: #fef3c7; color: #92400e; }

        .status-badge-live {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .exam-row:hover {
            transform: translateY(-2px);
            transition: all 0.3s ease;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen pb-16 text-[15px]">

    <!-- Header Section -->
    <header class="max-w-5xl mx-auto pt-12 px-4 text-center">
        <div class="inline-block bg-white px-4 py-1 rounded-full shadow-sm mb-4 text-orange-500 font-bold text-sm tracking-wide">
            BELIEVE IN YOURSELF
        </div>
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-3 text-slate-800">F5 Final Exam</h1>
        <p class="text-slate-500 font-medium">Keep going, the finish line is near!</p>
    </header>

    <!-- Global Next Exam Hero -->
    <section class="max-w-4xl mx-auto mt-10 px-4">
        <div id="main-countdown-container" class="countdown-gradient rounded-[2.5rem] p-10 text-white text-center relative overflow-hidden">
            <!-- Decorative circle -->
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
            
            <div class="relative z-10">
                <p class="text-xs uppercase tracking-[0.2em] mb-4 font-bold text-white/90">Next Challenge Starts In</p>
                <div class="grid grid-cols-4 gap-2 md:gap-4 mb-6">
                    <div class="bg-white/20 backdrop-blur-md rounded-2xl py-3">
                        <span id="days" class="text-4xl md:text-6xl font-bold tracking-tighter">00</span>
                        <p class="text-[10px] uppercase mt-1 font-bold">Days</p>
                    </div>
                    <div class="bg-white/20 backdrop-blur-md rounded-2xl py-3">
                        <span id="hours" class="text-4xl md:text-6xl font-bold tracking-tighter">00</span>
                        <p class="text-[10px] uppercase mt-1 font-bold">Hours</p>
                    </div>
                    <div class="bg-white/20 backdrop-blur-md rounded-2xl py-3">
                        <span id="minutes" class="text-4xl md:text-6xl font-bold tracking-tighter">00</span>
                        <p class="text-[10px] uppercase mt-1 font-bold">Mins</p>
                    </div>
                    <div class="bg-white/20 backdrop-blur-md rounded-2xl py-3">
                        <span id="seconds" class="text-4xl md:text-6xl font-bold tracking-tighter">00</span>
                        <p class="text-[10px] uppercase mt-1 font-bold">Secs</p>
                    </div>
                </div>
                <div id="target-label" class="text-sm font-bold bg-white text-orange-500 shadow-lg inline-flex items-center px-6 py-2.5 rounded-full">
                    Preparing Schedule...
                </div>
            </div>
        </div>
    </section>

    <!-- Timetable Section -->
    <main class="max-w-5xl mx-auto mt-16 px-4">
        <div class="flex items-center justify-between mb-8 border-b-2 border-white pb-6">
            <h2 class="text-2xl font-bold text-slate-700 flex items-center">
                <i class="fas fa-rocket mr-3 text-orange-400"></i>
                Exam Timetable
            </h2>
        </div>

        <div id="exam-list" class="space-y-6">
            <!-- Data injected by JS -->
        </div>

        <div class="mt-12 text-center text-slate-400 text-sm font-medium">
            <p>“Education is the passport to the future.” </p>
        </div>
    </main>

    <script>
        const exams = [
            { id: 1, date: '2026-06-11', day: 'Thursday (四)', time: '08:30', endTime: '10:00', subject: 'Chinese (1) Reading', venue: 'Hall (禮堂)', type: 'core' },
            { id: 2, date: '2026-06-11', day: 'Thursday (四)', time: '10:45', endTime: '13:00', subject: 'Chinese (2) Writing', venue: 'Hall (禮堂)', type: 'core' },
            { id: 3, date: '2026-06-12', day: 'Friday (五)', time: '08:30', endTime: '10:00', subject: 'English (1) Reading', venue: 'Hall (禮堂)', type: 'core' },
            { id: 4, date: '2026-06-12', day: 'Friday (五)', time: '10:45', endTime: '12:45', subject: 'English (2) Writing', venue: 'Hall (禮堂)', type: 'core' },
            { id: 5, date: '2026-06-15', day: 'Monday (一)', time: '08:30', endTime: '10:30', subject: 'Citizenship and Social Development', venue: 'Hall (禮堂)', type: 'core' },
            { id: 6, date: '2026-06-16', day: 'Tuesday (二)', time: '08:30', endTime: '10:45', subject: 'Mathematics (1)', venue: 'Hall (禮堂)', type: 'core' },
            { id: 7, date: '2026-06-16', day: 'Tuesday (二)', time: '11:30', endTime: '12:45', subject: 'Mathematics (2)', venue: 'Hall (禮堂)', type: 'core' },
            { id: 8, date: '2026-06-18', day: 'Thursday (四)', time: '08:30', endTime: '10:30', subject: 'English (3) Listening', venue: 'Rm 412-415', type: 'core' },
            { id: 9, date: '2026-06-22', day: 'Monday (一)', time: '08:30', endTime: '10:30', subject: 'Biology', venue: 'Hall (禮堂)', type: 'elective' },
            { id: 10, date: '2026-06-23', day: 'Tuesday (二)', time: '08:30', endTime: '10:00', subject: 'ICT', venue: 'Rm 413', type: 'elective' },
            { id: 11, date: '2026-06-26', day: 'Friday (五)', time: '08:30', endTime: '11:30', subject: 'English (4) Speaking', venue: 'Rm 111-115', type: 'core' }
        ];

        function renderExams() {
            const list = document.getElementById('exam-list');
            let lastDate = '';
            
            exams.forEach(exam => {
                const isNewDate = exam.date !== lastDate;
                const dateHeader = isNewDate ? `
                    <div class="flex items-center gap-4 pt-6 mb-4">
                        <span class="text-sm font-black text-indigo-400 uppercase tracking-[0.2em] bg-white px-4 py-1 rounded-full shadow-sm">${exam.date} (${exam.day.split(' ')[1]})</span>
                        <div class="h-[2px] flex-grow bg-white"></div>
                    </div>
                ` : '';

                const card = document.createElement('div');
                card.className = "exam-row transition-all duration-300";
                card.innerHTML = `
                    ${dateHeader}
                    <div class="glass-card p-6 mb-4 relative group">
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                            <!-- Time and Venue -->
                            <div class="col-span-3 space-y-1">
                                <div class="flex items-center text-indigo-600 font-bold text-lg">
                                    <i class="far fa-clock mr-2 text-indigo-300"></i>
                                    ${exam.time} - ${exam.endTime}
                                </div>
                                <div class="text-xs text-slate-400 flex items-center font-medium">
                                    <i class="fas fa-map-marker-alt mr-2 text-orange-300"></i>
                                    ${exam.venue}
                                </div>
                            </div>
                            
                            <!-- Subject -->
                            <div class="col-span-5 py-1">
                                <div class="flex flex-wrap items-center gap-3">
                                    <h3 class="text-xl font-bold text-slate-800">${exam.subject}</h3>
                                    <span class="text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider ${exam.type === 'core' ? 'subject-tag-core' : 'subject-tag-elective'}">
                                        ${exam.type}
                                    </span>
                                </div>
                            </div>

                            <!-- Individual Countdown -->
                            <div class="col-span-4 text-left md:text-right">
                                <div id="timer-${exam.id}" class="inline-block px-5 py-2.5 rounded-2xl bg-white border-2 border-slate-50 font-bold text-sm shadow-sm">
                                    Calculating...
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
                lastDate = exam.date;
            });
        }

        function formatTimeLeft(diff) {
            if (diff <= 0) return "FINISHED";
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);
            
            let parts = [];
            if (d > 0) parts.push(`${d}d`);
            parts.push(`${h}h`, `${m}m`, `${s}s`);
            return parts.join(' ');
        }

        function updateTimers() {
            const now = new Date().getTime();
            let nextExam = null;

            exams.forEach(exam => {
                const target = new Date(`${exam.date}T${exam.time}`).getTime();
                const endTarget = new Date(`${exam.date}T${exam.endTime}`).getTime();
                const diff = target - now;
                const timerEl = document.getElementById(`timer-${exam.id}`);

                if (now > endTarget) {
                    timerEl.innerHTML = `<span class="text-slate-300 italic">Completed ✓</span>`;
                    timerEl.classList.add('opacity-50');
                } else if (now >= target && now <= endTarget) {
                    timerEl.innerHTML = `<span class="text-green-500 status-badge-live">🔥 NOW ONGOING</span>`;
                    timerEl.closest('.glass-card').classList.add('border-green-300', 'bg-green-50/50');
                } else {
                    timerEl.innerHTML = `<span class="text-orange-500 font-bold"><i class="far fa-hourglass mr-2"></i>${formatTimeLeft(diff)}</span>`;
                    if (!nextExam) nextExam = exam;
                }
            });

            // Update Global Hero Countdown
            if (nextExam) {
                const target = new Date(`${nextExam.date}T${nextExam.time}`).getTime();
                const diff = target - now;
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = d.toString().padStart(2, '0');
                document.getElementById('hours').innerText = h.toString().padStart(2, '0');
                document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
                document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
                document.getElementById('target-label').innerHTML = `
                    <i class="fas fa-arrow-right mr-2"></i>
                    Upcoming: ${nextExam.subject}
                `;
            } else {
                document.getElementById('main-countdown-container').innerHTML = `
                    <div class="py-10">
                        <h2 class='text-4xl font-black mb-2'>🌈 YOU DID IT!</h2>
                        <p class='font-bold opacity-90'>All exams are finished. Time to celebrate!</p>
                    </div>
                `;
            }
        }

        window.onload = () => {
            renderExams();
            setInterval(updateTimers, 1000);
            updateTimers();
        };
    </script>
</body>
</html>
